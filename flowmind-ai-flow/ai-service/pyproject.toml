[tool.poetry]
name = "flowmind-ai-flow"
version = "1.0.0"
description = "FlowMind 智能流程设计服务"
authors = ["wish168 <contact@flowmind.com>"]
readme = "../README.md"
homepage = "http://flowmind.com"
repository = "https://github.com/flowmind/flowmind-ai-flow"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12,<3.14"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
starlette = "^0.40.0"
pydantic = "^2.11.0"
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.35"
pymysql = "^1.1.0"
redis = "^5.2.0"
langchain = "^0.3.7"
langchain-core = "^0.3.17"
langchain-community = "^0.3.7"
langgraph = "^1.0.0"
openai = "^1.48.0"
httpx = "0.28.0"
requests = "^2.32.3"
lxml = "^5.1.0"
structlog = "^25.1.0"
python-dotenv = "^1.0.1"
pyjwt = "^2.10.0"
python-multipart = "^0.0.12"
cryptography = "^43.0.3"
regex = "^2024.9.11"
typing-extensions = "^4.12.2"
debugpy = "^1.8.0"
nacos-sdk-python = "2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.8.0"
playwright = "^1.58.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = [
    "tests/system"
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "B904",
    "B005",
    "E402",
    "UP031",
    "UP042",
    "UP046",
    "RUF012",
    "SIM102",
    "SIM116",
    "TC001",
    "TC002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001", "RUF002", "RUF003"]
"app/*" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
