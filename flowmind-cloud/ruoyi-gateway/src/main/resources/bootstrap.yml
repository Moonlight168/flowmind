# Tomcat
server:
  port: 9001

# Spring
spring:
  application:
    # 应用名称
    name: flowmind-gateway
  profiles:
    # 环境配置
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      discovery:
        username: nacos  # Nacos登录用户名
        password: nacos  # Nacos登录密码
        # 服务注册地址（Docker 容器内: flowmind-nacos:8848，本地开发: localhost:18848）
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:localhost:18848}
      config:
        username: nacos
        password: nacos
        # 配置中心地址
        server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:localhost:18848}
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        # 禁用快照缓存，防止读取旧的服务器地址
        snapshot:
          enable: false
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: 127.0.0.1:8718
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            username: nacos
            password: nacos
            server-addr: ${SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR:localhost:18848}
            dataId: sentinel-ruoyi-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
