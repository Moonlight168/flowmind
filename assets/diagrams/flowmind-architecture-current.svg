<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">FlowMind 当前系统架构</title>
  <desc id="desc">Vue 前端经网关访问 Java 微服务和 AI 服务，基础设施包括 MySQL、Redis、Nacos 与独立 Langfuse。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{stroke-width:2;rx:16;ry:16}.label{font:700 17px Arial, 'Microsoft YaHei', sans-serif;fill:#0f172a}.small{font:14px Arial, 'Microsoft YaHei', sans-serif;fill:#334155}.zone-title{font:700 16px Arial, 'Microsoft YaHei', sans-serif;fill:#475569}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#fff"/>
  <text x="800" y="42" text-anchor="middle" style="font:700 28px Arial, 'Microsoft YaHei', sans-serif;fill:#0f172a">FlowMind 智能流程审批平台架构</text>

  <rect class="zone" x="45" y="70" width="1510" height="150"/>
  <text class="zone-title" x="70" y="102">用户入口</text>
  <rect class="box" x="570" y="115" width="460" height="75" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="label" x="800" y="146" text-anchor="middle">flowmind-ui · Vue 3 / Vite / BPMN-JS</text>
  <text class="small" x="800" y="172" text-anchor="middle">开发：127.0.0.1:18088　生产：Nginx :18088</text>

  <rect class="zone" x="45" y="250" width="1510" height="130"/>
  <text class="zone-title" x="70" y="282">统一入口</text>
  <rect class="box" x="570" y="292" width="460" height="60" fill="#ffedd5" stroke="#fb923c"/>
  <text class="label" x="800" y="327" text-anchor="middle">flowmind-gateway · Spring Cloud Gateway :9001</text>
  <path class="line" d="M800 190V290"/><text class="small" x="822" y="245">HTTP / SSE</text>

  <rect class="zone" x="45" y="410" width="1510" height="320"/>
  <text class="zone-title" x="70" y="442">业务与 AI 服务</text>
  <rect class="box" x="105" y="480" width="640" height="205" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="label" x="425" y="514" text-anchor="middle">flowmind-cloud · Java 微服务</text>
  <rect class="box" x="135" y="548" width="165" height="92" fill="#f5f3ff" stroke="#a78bfa"/><text class="label" x="218" y="583" text-anchor="middle">Auth</text><text class="small" x="218" y="610" text-anchor="middle">认证 :9002</text>
  <rect class="box" x="342" y="548" width="165" height="92" fill="#f5f3ff" stroke="#a78bfa"/><text class="label" x="425" y="583" text-anchor="middle">System</text><text class="small" x="425" y="610" text-anchor="middle">用户、角色 :9003</text>
  <rect class="box" x="549" y="548" width="165" height="92" fill="#f5f3ff" stroke="#a78bfa"/><text class="label" x="632" y="583" text-anchor="middle">Flowable</text><text class="small" x="632" y="610" text-anchor="middle">流程、表单 :9007</text>
  <rect class="box" x="855" y="480" width="640" height="205" fill="#faf5ff" stroke="#c084fc"/>
  <text class="label" x="1175" y="514" text-anchor="middle">flowmind-ai-service · FastAPI / LangGraph</text>
  <text class="small" x="1175" y="554" text-anchor="middle">prepare → design（ReAct 检索、结构化生成）→ review → format</text>
  <text class="small" x="1175" y="586" text-anchor="middle">分类、基本信息、表单、流程模型设计 · SSE · 变更预览</text>
  <text class="small" x="1175" y="622" text-anchor="middle">开发发布：127.0.0.1:80；生产环境仅经网关访问</text>
  <path class="line" d="M710 352V448H425V477"/><path class="line" d="M890 352V448H1175V477"/>

  <rect class="zone" x="45" y="760" width="1510" height="220"/>
  <text class="zone-title" x="70" y="792">Docker 基础设施与可观测性</text>
  <rect class="box" x="130" y="835" width="220" height="95" fill="#ecfdf5" stroke="#34d399"/><text class="label" x="240" y="872" text-anchor="middle">MySQL 5.7</text><text class="small" x="240" y="900" text-anchor="middle">宿主机 :13306</text>
  <rect class="box" x="410" y="835" width="220" height="95" fill="#ecfdf5" stroke="#34d399"/><text class="label" x="520" y="872" text-anchor="middle">Redis 7</text><text class="small" x="520" y="900" text-anchor="middle">宿主机 :16379</text>
  <rect class="box" x="690" y="835" width="220" height="95" fill="#fefce8" stroke="#facc15"/><text class="label" x="800" y="872" text-anchor="middle">Nacos</text><text class="small" x="800" y="900" text-anchor="middle">宿主机 :18848</text>
  <rect class="box" x="970" y="835" width="360" height="95" fill="#fdf2f8" stroke="#f472b6"/><text class="label" x="1150" y="872" text-anchor="middle">独立 Langfuse</text><text class="small" x="1150" y="900" text-anchor="middle">项目 flowmind · 宿主机 :13001</text>
  <path class="line" d="M425 687V790H240V832"/><path class="line" d="M500 687V790H520V832"/><path class="line" d="M610 687V790H800V832"/><path class="line" d="M1270 687V790H1150V832"/>
</svg>
