# FlowMind AI 开发环境：只保留 AI 服务链路必需的基础设施与后端，其余微服务不启动
# 启动：docker compose up -d --remove-orphans
# --remove-orphans 会在从生产栈切回开发栈时清理占用 18088 的旧 Nginx 容器。

services:
  # 只复用生产文件中 AI 服务必需的基础设施与后端定义，不把生产 Nginx 引入开发模型。
  # 这样 --remove-orphans 能在环境切换时识别并清理旧 Nginx 容器。
  # 必需后端：gateway（业务 API 入口）/ auth（登录）/ system（角色）/ flowable（分类·表单·流程模型）。
  flowmind-mysql:
    extends:
      file: docker-compose.prod.yml
      service: flowmind-mysql

  flowmind-redis:
    extends:
      file: docker-compose.prod.yml
      service: flowmind-redis

  flowmind-nacos:
    extends:
      file: docker-compose.prod.yml
      service: flowmind-nacos

  flowmind-gateway:
    extends:
      file: docker-compose.prod.yml
      service: flowmind-gateway

  flowmind-auth:
    extends:
      file: docker-compose.prod.yml
      service: flowmind-auth

  flowmind-system:
    extends:
      file: docker-compose.prod.yml
      service: flowmind-system

  flowmind-flowable:
    extends:
      file: docker-compose.prod.yml
      service: flowmind-flowable

  flowmind-ui:
    container_name: flowmind-ui
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "test -x node_modules/.bin/vite || npm install --no-package-lock --no-audit --no-fund; npm run dev -- --host 0.0.0.0 --port 88"
    environment:
      VITE_PROXY_TARGET: http://flowmind-gateway:9001
      VITE_OPEN: "false"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FLOWMIND_HTTP_PORT:-18088}:88"
    volumes:
      - ../../flowmind-ui:/app
      - flowmind_ui_node_modules:/app/node_modules
    depends_on:
      flowmind-gateway:
        condition: service_started
    networks:
      - flowmind-network

  flowmind-ai-service:
    extends:
      file: docker-compose.prod.yml
      service: flowmind-ai-service
    environment:
      ENV_TYPE: dev
      LOG_LEVEL: DEBUG
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../../flowmind-ai-flow/ai-service/app:/app/app
    command:
      - poetry
      - run
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
      - --no-access-log

volumes:
  flowmind_ui_node_modules:

networks:
  flowmind-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
